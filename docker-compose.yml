services:
  # ================================================
  # PostgreSQL Database
  # ================================================
  db:
    image: postgres:16-alpine
    container_name: healthcare_mart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcare_pass}
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_mart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
      - ./sql:/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthcare} -d ${POSTGRES_DB:-healthcare_mart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ================================================
  # Data Pipeline Application
  # ================================================
  app:
    build: .
    container_name: healthcare_mart_app
    profiles: ["pipeline"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
